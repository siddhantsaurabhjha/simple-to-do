<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student / Task Management Portal</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for modern clean typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        
        <!-- Header Section -->
        <header class="app-header">
            <h1>Student / Task Management Portal</h1>
            <p class="subtitle">Manage students, tasks and completion status</p>
        </header>

        <!-- Backend Status Alert Banner -->
        <div id="status-banner" class="banner hidden">
            <span id="banner-message"></span>
        </div>

        <!-- Dashboard Statistics Cards -->
        <section class="stats-grid">
            <div class="stat-card">
                <span class="stat-title">Total Records</span>
                <span class="stat-value" id="stat-total">0</span>
            </div>
            <div class="stat-card stat-pending-card">
                <span class="stat-title">Pending</span>
                <span class="stat-value" id="stat-pending">0</span>
            </div>
            <div class="stat-card stat-completed-card">
                <span class="stat-title">Completed</span>
                <span class="stat-value" id="stat-completed">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-title">Categories</span>
                <span class="stat-value" id="stat-categories">0</span>
            </div>
        </section>

        <!-- Form Card for Adding / Updating Record -->
        <section class="card form-card">
            <h2 id="form-title">Add New Record</h2>
            <form id="record-form">
                <!-- Hidden input to store editing record ID -->
                <input type="hidden" id="record-id">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">Student Name *</label>
                        <input type="text" id="name" placeholder="e.g. Rahul" required>
                    </div>

                    <div class="form-group">
                        <label for="roll-number">Roll Number *</label>
                        <input type="text" id="roll-number" placeholder="e.g. BCA101" required>
                    </div>

                    <div class="form-group">
                        <label for="task">Task Description *</label>
                        <input type="text" id="task" placeholder="e.g. Complete Python Assignment" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Category *</label>
                        <select id="category" required>
                            <option value="">Select Category</option>
                            <option value="Assignment">Assignment</option>
                            <option value="Project">Project</option>
                            <option value="Exam">Exam</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="status">Status *</label>
                        <select id="status" required>
                            <option value="Pending">Pending</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submit-btn" class="btn btn-primary">Add Record</button>
                    <button type="button" id="cancel-btn" class="btn btn-secondary hidden">Cancel</button>
                </div>
            </form>
        </section>

        <!-- Record List Section -->
        <section class="card table-card">
            <div class="table-header">
                <h2>Records List</h2>
                
                <!-- Search and Filter Controls -->
                <div class="controls-grid">
                    <div class="search-box">
                        <input type="text" id="search-input" placeholder="Search by name, roll number or task...">
                    </div>
                    <div class="filter-box">
                        <select id="filter-status">
                            <option value="All">All Statuses</option>
                            <option value="Pending">Pending</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Loading Indicator -->
            <div id="loading-spinner" class="loading-state">
                <p>Loading...</p>
            </div>

            <!-- Table Container (Scrollable on small screens) -->
            <div class="table-responsive">
                <table id="records-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Roll Number</th>
                            <th>Task</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="records-tbody">
                        <!-- Record rows dynamically inserted via JavaScript -->
                    </tbody>
                </table>
            </div>

            <!-- Empty State Message -->
            <div id="empty-state" class="empty-state hidden">
                <p class="empty-title">No records found.</p>
                <p class="empty-subtitle">Add your first student task above.</p>
            </div>
        </section>

    </div>

    <!-- JavaScript File -->
    <script src="script.js"></script>
</body>
</html>
